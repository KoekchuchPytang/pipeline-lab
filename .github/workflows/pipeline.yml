name: Matrix Strategy 

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16, 18, 20]
        include:
          - os: ubuntu-latest
            node-version: 20
            experimental: true
        exclude:
          - os: windows-latest
            node-version: 16
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Informações da Matrix
        run: |
          echo "Sistema Operacional: ${{ matrix.os }}"
          echo "Versão do Node.js: ${{ matrix.node-version }}"
          if [ "${{ matrix.experimental }}" == "true" ]; then
            echo "Modo experimental ativado"
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verificar versões
        run: |
          echo "Versão do Node.js: $(node -v)"
          echo "Versão do npm: $(npm -v)"

      - name: Executar testes específicos do OS
        run: |
          echo "Executando testes no sistema operacional: ${{ matrix.os }} com Node.js versão: ${{ matrix.node-version }} ..."
          sleep 2
          echo "Testes concluídos"

      - name: Teste experimental
        if: ${{ matrix.experimental == 'true' }}
        run: |
          echo "Executando testes experimentais..."
          sleep 1
          echo "Testes experimentais concluídos"
        
  collect-results:
    needs: test-matrix
    runs-on: ubuntu-latest
    
    steps:
      - name: Coletar resultados
        run: |
          echo "Coletando resultados dos testes..."
          sleep 1
          echo "Resultados coletados"